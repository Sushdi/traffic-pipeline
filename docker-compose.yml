version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models          # hot-swap models without rebuild
      - ./params.yaml:/app/params.yaml
      - ./monitoring:/app/monitoring  # eval_log.csv read by /metrics/drift
    restart: unless-stopped

  # Optional: Prometheus scrapes /metrics
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api