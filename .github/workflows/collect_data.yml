name: Collect Traffic Data

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas pyyaml

      - name: Run collection loop (6 hours)
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          python - <<'PYEOF'
          import subprocess, time, datetime, logging
          logging.basicConfig(level=logging.INFO, format="%(asctime)s %(message)s")
          log = logging.getLogger()

          interval = 300
          end_time = time.time() + (340 * 60)
          snapshot = 0

          while time.time() < end_time:
              snapshot += 1
              log.info("Snapshot #%d @ %s", snapshot, datetime.datetime.utcnow().isoformat())
              t0 = time.time()
              subprocess.run(["python", "src/collect.py"], check=True)
              elapsed = time.time() - t0
              sleep_for = max(0, interval - elapsed)
              if (end_time - time.time()) < interval:
                  log.info("Job window ending.")
                  break
              time.sleep(sleep_for)

          log.info("Done. %d snapshots.", snapshot)
          PYEOF

      - name: Commit collected data to repo
        run: |
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git add data/raw/traffic_raw.csv
          git diff --staged --quiet || \
            git commit -m "data: batch $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push

      - name: Chain next job if within 72h window
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          COLLECTION_START_EPOCH: ${{ vars.COLLECTION_START_EPOCH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PYEOF'
          import time, os, urllib.request, json, sys

          start = int(os.environ.get("COLLECTION_START_EPOCH", "0"))
          if start == 0:
              print("No start epoch — stopping.")
              sys.exit(0)

          elapsed_hours = (time.time() - start) / 3600
          print(f"Elapsed: {elapsed_hours:.1f}h / 72h")

          if elapsed_hours >= 72:
              print("72h complete — collection finished!")
              sys.exit(0)

          print("Triggering next 6h job via GitHub API...")
          repo  = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          url  = f"https://api.github.com/repos/{repo}/actions/workflows/collect_data.yml/dispatches"
          data = json.dumps({"ref": "main"}).encode()
          req  = urllib.request.Request(url, data=data, method="POST")
          req.add_header("Authorization", f"Bearer {token}")
          req.add_header("Accept", "application/vnd.github+json")
          req.add_header("Content-Type", "application/json")

          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Next job triggered. Status: {resp.status}")
          except urllib.error.HTTPError as e:
              print(f"Failed to trigger: {e.code} {e.reason}")
              print(e.read().decode())
              sys.exit(1)
          PYEOF